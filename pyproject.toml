
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "china-multi-asset-quant"
version = "0.1.0"
description = "Point-in-time research on China macro regimes and fixed-income-plus portfolios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "scikit-learn>=1.6",
    "statsmodels>=0.14", "cvxpy>=1.6", "lightgbm>=4.5", "pyarrow>=18",
    "pyyaml>=6", "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
